# End-to-end tests that run this action from the repository itself (uses: ./).
#
# The valid-inputs job mirrors how a user adopts the action: their existing
# build job checks out the source and sets up the toolchain, then this action
# replaces the build step, and later steps keep running as usual.
#
# Runner: ubuntu-22.04 (kernel 6.8). witness eBPF file trace currently fails on
# kernel 7.0 (go-witness issue, handled upstream), and Ubuntu 24.04 images are
# moving to kernel 7.0. Network trace needs kernel 6.12+, so the runner will be
# revisited when network trace is implemented.
name: E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valid-inputs:
    runs-on: ubuntu-22.04
    steps:
      # ── User's existing job: checkout + toolchain setup ──
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/fixtures/go-hello/go.mod
          cache: false   # recommended for an accurate SBOM

      # ── This action replaces the user's build step ──
      - name: Build under SBOMit
        id: sbomit
        uses: ./
        with:
          build-command: |
            cd tests/fixtures/go-hello
            go build -trimpath -o bin/go-hello .

      # ── User's later steps must keep working (files are returned to the runner user) ──
      - name: Later step can use build outputs and caches
        run: |
          set -euo pipefail
          ./tests/fixtures/go-hello/bin/go-hello
          touch tests/fixtures/go-hello/bin/go-hello   # fails if still root-owned
          go clean -cache                               # writes to ~/.cache/go-build
          echo "Build outputs and Go caches are writable by the runner user."

      - name: Check action outputs
        env:
          ATTESTATION_PATH: ${{ steps.sbomit.outputs.attestation-path }}
          SBOM_PATH: ${{ steps.sbomit.outputs.sbom-path }}
          METADATA_PATH: ${{ steps.sbomit.outputs.metadata-path }}
        run: |
          set -euo pipefail
          for p in "$ATTESTATION_PATH" "$SBOM_PATH" "$METADATA_PATH"; do
            [ -s "$p" ] || { echo "::error::Missing or empty output file: '${p}'"; exit 1; }
            echo "ok: $p"
          done
          status="$(jq -r '.status' "$METADATA_PATH")"
          [ "$status" = "sbom_generated" ] || { echo "::error::run-metadata status is '${status}'"; exit 1; }
          jq '{status, inputs, facts: (.facts | {RUNNER_KERNEL, WITNESS_SOURCE, GO_WITNESS_SOURCE, SBOMIT_VERSION, SYFT_VERSION, SBOM_PACKAGES, OWNERSHIP_RESTORED_FILES})}' "$METADATA_PATH"

  # Invalid inputs must be rejected by Stage 0. The action step is allowed to fail,
  # and the next step asserts that it actually failed.
  invalid-inputs:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: empty-build-command
            build_command: "   "
            network_trace: "false"
            sbom_format: spdx23
            use_syft: "true"
          - case: unknown-sbom-format
            build_command: "true"
            network_trace: "false"
            sbom_format: spdx22
            use_syft: "true"
          - case: non-bool-network-trace
            build_command: "true"
            network_trace: "yes"
            sbom_format: spdx23
            use_syft: "true"
          # Temporary: network trace is not implemented yet. Remove when it is.
          - case: network-trace-not-supported-yet
            build_command: "true"
            network_trace: "true"
            sbom_format: spdx23
            use_syft: "true"
          - case: cdx15-with-syft
            build_command: "true"
            network_trace: "false"
            sbom_format: cdx15
            use_syft: "true"
    name: invalid-inputs (${{ matrix.case }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run SBOMit action (expected to fail)
        id: sbomit
        continue-on-error: true
        uses: ./
        with:
          build-command: ${{ matrix.build_command }}
          network-trace: ${{ matrix.network_trace }}
          sbom-format: ${{ matrix.sbom_format }}
          use-syft: ${{ matrix.use_syft }}
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.sbomit.outcome }}
        run: |
          echo "outcome: ${OUTCOME}"
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected Stage 0 to reject case '${{ matrix.case }}', but the action outcome was '${OUTCOME}'."
            exit 1
          fi
